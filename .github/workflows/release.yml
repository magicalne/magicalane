name: Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: magicalane-linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: magicalane-linux-arm64 }
          # macos-latest = Apple Silicon (M-series)
          - { os: macos-latest, target: aarch64-apple-darwin, asset: magicalane-macos-arm64 }
          # Intel macs: cross-compiled on the arm runner (clang -arch x86_64)
          - { os: macos-latest, target: x86_64-apple-darwin, asset: magicalane-macos-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Tests (native targets only)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --verbose
      - name: Build (tun-mode included)
        run: cargo build --release --features tun-mode --target ${{ matrix.target }}
      - name: Package
        run: |
          cd "target/${{ matrix.target }}/release"
          cp magicalane "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - name: Upload binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.asset }}
          asset_name: ${{ matrix.asset }}
          tag: ${{ github.ref }}
          overwrite: true
      - name: Upload checksum
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.asset }}.sha256
          asset_name: ${{ matrix.asset }}.sha256
          tag: ${{ github.ref }}
          overwrite: true
