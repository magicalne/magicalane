# Same as client.toml but with a WRONG password - used by env/test.sh to verify
# that application-level authentication is enforced (QUIC/TLS still succeeds).
password = "wrong-password"
bandwidth = 65536
verbose = true
kind = { Client = { proxy = { host = "magicalane-server", port = 4433, ca_path = "/etc/magicalane/certs/ca.pem" }, socks5_port = 1080, tproxy = { tcp_port = 7895, udp_port = 7896 } } }
