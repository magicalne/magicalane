# TUN mode: a userspace TCP/IP stack intercepts everything WITHOUT
# iptables — same routing engine, same fake-IP DNS.
# Requires: cargo build --release --features tun-mode
# Linux: creates /dev/net/tun device mgl0 (containers: --device
#   /dev/net/tun); CAP_NET_ADMIN for route setup.
# macOS: creates a utun device (kernel-assigned utunN) and captures
#   traffic with 0.0.0.0/1 + 128.0.0.0/1 + 2000::/3 routes — the
#   original default route is never modified. Run with sudo. The
#   clean-exit contract applies on both platforms.
password = "change-me"
bandwidth = 65536
verbose = true
kind = { Client = { proxy = { host = "my-server", port = 4433, ca_path = "/etc/magicalane/certs/ca.pem" }, socks5_port = 1080, tproxy = { mode = "tun", tcp_port = 0, udp_port = 0, dns_port = 0, dns_mode = "fakeip" }, routing = { default = "proxy", rule = [ { domain_suffix = ["cn"], action = "direct" } ] } } }
