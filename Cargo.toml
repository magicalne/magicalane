[package]
name = "magicalane"
version = "0.1.0"
authors = ["magicalne"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "lib"
path = "src/lib.rs"

[[bin]]
name = "magicalane"
path = "src/main.rs"

[dependencies]
bytes = "1"
libc = "0.2.69"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
kcp = "0.6"
log = "0.4.14"
env_logger = "0.9.0"
tracing = "0.1.10"
tracing-log = "0.1.2"
tracing-appender = "0.1"
tracing-subscriber = { version = "0.2.5", default-features = false, features = ["env-filter", "fmt", "ansi", "chrono"]}
tracing-futures = { version = "0.2.0", default-features = false, features = ["std-future"] }
tokio-trace = { version = "0.1", features = ["log"] }
futures = "0.3.1"
tokio-util = { version = "0.7", features = ["full"] }
futures-core = "0.3.5"
tokio = { version = "^1.2.0", features = ["full"] }
anyhow = "1.0.22"
thiserror = "1.0"
toml = "0.5.8"
serde = { version = "1.0", features = ["derive"] }
directories-next = "1.0.1"
directories = "2.0"
rand = "0.7"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
structopt = "0.3.0"
pin-project = "1.0.7"
socket2 = "0.5"
rustls-pki-types = "1"
tun = { version = "0.8", features = ["async"], optional = true }
smoltcp = { version = "0.14", features = ["proto-ipv4", "medium-ip", "socket-tcp", "socket-udp"], optional = true }
base64 = "0.22"
webpki-roots = "0.26"


[features]
default = []
tun-mode = ["dep:tun", "dep:smoltcp"]
