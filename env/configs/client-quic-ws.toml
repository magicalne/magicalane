# Workstation-mode client: transparent interception (tproxy) inside the
# client container. Run as a second instance: magicalane --config client-ws.toml
password = "test-password"
bandwidth = 65536
verbose = true
kind = { Client = { proxy = { host = "magicalane-server", port = 4433, ca_path = "/etc/magicalane/certs/ca.pem", protocol = "quic" }, socks5_port = 1081, tproxy = { mode = "tproxy", tcp_port = 7895, udp_port = 7896, dns_port = 15353 } } }
